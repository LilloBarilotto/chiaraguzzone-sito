# Sveltia CMS - configurazione per il sito della Dott.ssa Chiara Guzzone.
# I campi rispecchiano gli schemi in src/content.config.ts: se uno cambia, aggiornare anche l'altro.

backend:
  name: github
  repo: "LilloBarilotto/chiaraguzzone-sito"
  branch: main
  # Login con GitHub tramite il provider OAuth di Netlify.
  base_url: https://api.netlify.com
  auth_endpoint: auth

# Lingua dell'interfaccia (Sveltia include l'italiano; se mancasse ripiega sull'inglese).
locale: it

media_folder: public/uploads
public_folder: /uploads

# Ottimizzazione automatica delle immagini caricate.
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1600

# I link "vedi sul sito" del pannello portano all'Anteprima (branch main): lì si vedono subito le modifiche salvate.
site_url: https://main--chiaraguzzone.netlify.app
display_url: https://main--chiaraguzzone.netlify.app
logo_url: /favicon.svg

collections:
  # ---------------------------------------------------------------- BLOG
  - name: blog
    label: Articoli del blog
    label_singular: Articolo
    folder: src/content/blog
    preview_path: "blog/{{slug}}"
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} - {{pubDate}}"
    sortable_fields: [pubDate, title]
    sort: pubDate:desc
    fields:
      - { name: title, label: Titolo, widget: string, hint: "Includi la parola chiave principale, es. 'Ansia: quando chiedere aiuto'." }
      - name: description
        label: Descrizione breve per Google (max 160 caratteri)
        widget: text
        hint: "Una o due frasi che riassumono l'articolo. Compare nei risultati di Google. Massimo 160 caratteri."
        pattern: ['^[\s\S]{1,170}$', "Massimo 170 caratteri (consigliati 150-160)."]
      - { name: pubDate, label: Data di pubblicazione, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, default: "{{now}}", hint: "Se metti una data futura l'articolo potrebbe non comparire subito." }
      - { name: updatedDate, label: Data di ultima modifica, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, required: false, hint: "Facoltativa: compilala solo se aggiorni un articolo gia' pubblicato." }
      - { name: cover, label: Immagine di copertina, widget: image, required: false, hint: "Consigliata: orizzontale, circa 1600 x 900 pixel." }
      - { name: coverAlt, label: Descrizione dell'immagine, widget: string, required: false, hint: "Descrivi in poche parole cosa si vede (serve a chi non vede l'immagine e a Google)." }
      - { name: tags, label: Argomenti (tag), widget: list, required: false, default: [], hint: "Parole chiave brevi, es. ansia, coppia. Aggiungine 1-3." }
      - { name: draft, label: Bozza (non pubblicare), widget: boolean, default: false, hint: "Attivo = l'articolo NON compare sul sito. Disattivalo quando e' pronto." }
      - name: body
        label: Testo
        widget: markdown
        hint: "Usa i sottotitoli (H2) per dividere il testo. Inserisci un link a un tema e alla pagina Contatti. In fondo ricorda il disclaimer: 'Questo articolo ha scopo informativo e non sostituisce un colloquio psicologico.'"

  # ---------------------------------------------------------------- TEMI
  - name: temi
    label: Di cosa mi occupo
    label_singular: Tema
    folder: src/content/temi
    preview_path: "di-cosa-mi-occupo/{{slug}}"
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    sortable_fields: [order, title]
    sort: order:asc
    fields:
      - { name: title, label: Titolo, widget: string }
      - { name: seoTitle, label: Titolo per Google, widget: string, required: false, hint: "Facoltativo. Se vuoto si usa il titolo. Es. 'Psicologa per l'ansia a Milano'." }
      - { name: description, label: Descrizione per Google, widget: text, hint: "Circa 150 caratteri." }
      - { name: excerpt, label: Testo breve per l'anteprima, widget: text, hint: "Poche righe mostrate nella scheda del tema." }
      - { name: order, label: Posizione nell'elenco, widget: number, value_type: int, min: 1, default: 1, hint: "1 = primo." }
      - { name: draft, label: Bozza (non pubblicare), widget: boolean, default: false }
      - { name: body, label: Testo, widget: markdown }

  # ---------------------------------------------------------------- SERVIZI
  - name: servizi
    label: Servizi
    label_singular: Servizio
    folder: src/content/servizi
    preview_path: "servizi/{{slug}}"
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    sortable_fields: [order, title]
    sort: order:asc
    fields:
      - { name: title, label: Titolo, widget: string }
      - { name: seoTitle, label: Titolo per Google, widget: string, required: false, hint: "Facoltativo." }
      - { name: description, label: Descrizione per Google, widget: text, hint: "Circa 150 caratteri." }
      - { name: excerpt, label: Testo breve per l'anteprima, widget: text }
      - { name: forWhom, label: A chi e' rivolto, widget: string, hint: "Es. Adolescenti, giovani e adulti." }
      - name: modalita
        label: Modalita'
        widget: select
        multiple: true
        min: 1
        options:
          - { label: In studio, value: studio }
          - { label: Online, value: online }
        default: [studio, online]
      - { name: order, label: Posizione nell'elenco, widget: number, value_type: int, min: 1, default: 1 }
      - { name: draft, label: Bozza (non pubblicare), widget: boolean, default: false }
      - { name: body, label: Testo, widget: markdown }

  # ---------------------------------------------------------------- FAQ
  - name: faq
    label: Domande frequenti
    label_singular: Domanda
    folder: src/content/faq
    preview_path: "faq"
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: question
    summary: "{{order}}. {{question}}"
    sortable_fields: [order, question]
    sort: order:asc
    fields:
      - { name: question, label: Domanda, widget: string }
      - { name: order, label: Posizione nell'elenco, widget: number, value_type: int, min: 1, default: 1 }
      - { name: showOnHome, label: Mostra anche nella Home, widget: boolean, default: false }
      - { name: body, label: Risposta, widget: markdown }

  # ---------------------------------------------------------------- IMPOSTAZIONI
  - name: impostazioni
    label: Impostazioni e pagine
    files:
      - name: site
        label: Contatti e studi
        file: src/data/site.json
        format: json
        fields:
          - { name: name, label: Nome, widget: string }
          - { name: title, label: Titolo professionale (con Dott.ssa), widget: string }
          - { name: role, label: Ruolo, widget: string }
          - { name: albo, label: Testo iscrizione all'Albo, widget: string }
          - { name: alboNumber, label: Numero Albo, widget: string }
          - { name: phone, label: Telefono (come si legge), widget: string, hint: "Es. +39 350 089 7658" }
          - { name: phoneHref, label: Telefono (link), widget: string, hint: "Formato tel:+39xxxxxxxxxx, senza spazi." }
          - { name: whatsapp, label: Numero WhatsApp, widget: string, hint: "Solo cifre con prefisso, senza + e spazi. Es. 393500897658" }
          - { name: whatsappText, label: Messaggio WhatsApp precompilato, widget: text }
          - { name: email, label: Email, widget: string }
          - name: instagram
            label: Instagram
            widget: object
            fields:
              - { name: handle, label: Nome profilo, widget: string, hint: "Es. @chiaraguzzone" }
              - { name: url, label: Indirizzo del profilo, widget: string, hint: "Es. https://instagram.com/..." }
          - { name: piva, label: Partita IVA, widget: string }
          - name: studios
            label: Studi
            label_singular: Studio
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: id, label: Identificativo (breve, senza spazi), widget: string, hint: "Es. venini. Non cambiarlo senza chiedere." }
              - { name: name, label: Nome dello studio, widget: string }
              - { name: primary, label: Studio principale, widget: boolean, default: false }
              - { name: street, label: Via e numero, widget: string }
              - { name: city, label: Citta', widget: string }
              - { name: postalCode, label: CAP, widget: string }
              - { name: note, label: Come arrivare, widget: string, hint: "Es. MM1 Pasteur / Rovereto" }
              - { name: lat, label: Latitudine, widget: number, value_type: float, hint: "Es. 45.4935. Serve per la mappa: chiedi aiuto prima di cambiarla." }
              - { name: lng, label: Longitudine, widget: number, value_type: float, hint: "Es. 9.2195." }
          - { name: online, label: Colloqui online disponibili, widget: boolean, default: true }

      - name: home
        label: Testi della Home
        file: src/data/home.json
        format: json
        fields:
          - name: hero
            label: Parte iniziale (in alto)
            widget: object
            fields:
              - { name: heading, label: Titolo principale della pagina (h1, importante per Google), widget: string }
              - { name: title, label: Frase di apertura, widget: string }
              - { name: subtitle, label: Sottotitolo, widget: text }
              - { name: ctaPrimary, label: Pulsante principale, widget: string }
              - { name: ctaSecondary, label: Pulsante secondario, widget: string }
          - name: riconosci
            label: Ti riconosci?
            widget: object
            fields:
              - { name: title, label: Titolo, widget: string }
              - { name: intro, label: Introduzione, widget: text }
              - { name: items, label: Elenco, widget: list, field: { name: item, label: Voce, widget: string } }
          - name: approccio
            label: Il mio approccio
            widget: object
            fields:
              - { name: title, label: Titolo, widget: string }
              - { name: intro, label: Introduzione, widget: text }
              - name: costruttivista
                label: Approccio costruttivista
                widget: object
                fields:
                  - { name: title, label: Titolo, widget: string }
                  - { name: text, label: Testo, widget: text }
              - name: cbt
                label: Approccio cognitivo-comportamentale
                widget: object
                fields:
                  - { name: title, label: Titolo, widget: string }
                  - { name: text, label: Testo, widget: text }
              - name: passi
                label: Come si svolge (passi)
                label_singular: Passo
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: Titolo, widget: string }
                  - { name: text, label: Testo, widget: text }
          - name: chiSonoTeaser
            label: Anteprima "Chi sono"
            widget: object
            fields:
              - { name: title, label: Titolo, widget: string }
              - { name: text, label: Testo, widget: text }
          - name: studi
            label: Sezione studi
            widget: object
            fields:
              - { name: title, label: Titolo, widget: string }
              - { name: intro, label: Introduzione, widget: text }
          - name: faq
            label: Sezione domande frequenti
            widget: object
            fields:
              - { name: title, label: Titolo, widget: string }
          - name: blog
            label: Sezione blog
            widget: object
            fields:
              - { name: title, label: Titolo, widget: string }
          - name: ctaFinale
            label: Invito finale
            widget: object
            fields:
              - { name: title, label: Titolo, widget: string }
              - { name: text, label: Testo, widget: text }
              - { name: button, label: Testo del pulsante, widget: string }

      - name: chi-sono
        label: Pagina Chi sono
        file: src/content-pages/chi-sono.md
        format: frontmatter
        fields:
          - { name: body, label: Testo, widget: markdown }

      - name: privacy
        label: Pagina Privacy
        file: src/content-pages/privacy.md
        format: frontmatter
        fields:
          - { name: body, label: Testo, widget: markdown, hint: "Testo legale: modificalo solo se necessario." }
